name: Build Yuma APK
on:
  push:
    branches: [ "main" ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
      - name: Build APK
        run: ./gradlew assembleFossMobileArm64Debug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: YumaPlayer-APK
          path: app/build/outputs/apk/fossMobileArm64/debug/*.apk
